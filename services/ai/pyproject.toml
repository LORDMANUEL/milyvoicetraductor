[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "milyvoice-ai-engine"
version = "2.1.0"
description = "Motor local de ASR y traducción de MilyVoiceTraductor"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "numpy>=2.2,<3",
  "faster-whisper>=1.1,<2",
  "transformers>=4.51,<6",
  "torch>=2.7,<3",
  "huggingface-hub>=0.34,<2",
  "sentencepiece>=0.2,<1",
  "safetensors>=0.5,<1",
  "moonshine-voice==0.1.0; platform_machine == 'AMD64' or platform_machine == 'x86_64'",
  "sherpa-onnx==1.13.4",
  "vosk==0.3.45",
  "google-cloud-speech==2.40.0",
  "PyAudioWPatch==0.2.12.8; sys_platform == 'win32'"
]

[project.optional-dependencies]
build = ["nuitka>=2.7,<3", "ordered-set>=4.1", "zstandard>=0.23"]

[project.scripts]
mily-ai-engine = "mily_ai.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mily_ai*"]

[tool.setuptools.package-data]
mily_ai = ["model-packs.json", "engine-families.json"]
