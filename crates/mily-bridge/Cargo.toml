[package]
name = "mily-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "milyvoice-bridge"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
mily-config = { path = "../mily-config" }
mily-engine = { path = "../mily-engine" }
mily-models = { path = "../mily-models" }
