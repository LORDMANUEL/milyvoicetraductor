name: Patch Model Advisor backend truth

on:
  push:
    branches: [agent/enginehub-memory-selection-fix]

permissions:
  contents: write

concurrency:
  group: patch-model-advisor-backend-truth
  cancel-in-progress: true

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[backend truth applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/enginehub-memory-selection-fix
          fetch-depth: 0
      - name: Remove undefined state and bind selection to measured backend
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('services/ai/mily_ai/model_advisor.py')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '            total_product_mb=measured_total_product,\n            dedicated_vram_mb=',
              '            dedicated_vram_mb=',
              1,
          )

          marker = '''        end_to_end_p95 = _finite_non_negative(\n            report.get(\n                "endToEndP95Ms",\n                report.get("translationP95Ms", 99999.0),\n            ),\n            99999.0,\n        )\n        return EngineCandidate(\n'''
          replacement = '''        end_to_end_p95 = _finite_non_negative(\n            report.get(\n                "endToEndP95Ms",\n                report.get("translationP95Ms", 99999.0),\n            ),\n            99999.0,\n        )\n        supported_backends = tuple(\n            str(item).strip().lower()\n            for item in definition.get("supportedBackends", ("cpu",))\n        )\n        reported_backend = str(report.get("backend", "cpu")).strip().lower()\n        if reported_backend == "gpu":\n            reported_backend = "cuda"\n        measured_backend = (\n            reported_backend\n            if reported_backend in supported_backends\n            else "unverified"\n        )\n        return EngineCandidate(\n'''
          if 'measured_backend = (' not in text:
              if marker not in text:
                  raise SystemExit('Backend insertion point not found')
              text = text.replace(marker, replacement, 1)

          old = '''            backends=tuple(\n                str(item)\n                for item in definition.get(\n                    "supportedBackends", ("cpu",)\n                )\n            ),\n'''
          new = '''            backends=(measured_backend,),\n'''
          if old in text:
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/ai/mily_ai/model_advisor.py
          git commit -m "fix: select only measured backends [backend truth applied]"
          git push origin HEAD:agent/enginehub-memory-selection-fix
