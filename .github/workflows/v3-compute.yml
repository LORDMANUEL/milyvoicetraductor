name: V3 Compute

on:
  pull_request:
    paths:
      - "crates/mily-compute/**"
      - "contracts/compute/**"
      - "contracts/index.json"
      - "manifests/milyvoice-3.components.json"
      - "scripts/test_v3_component_manifest.py"
      - ".github/workflows/v3-compute.yml"
      - "docs/superpowers/specs/2026-08-23-milyvoice-3-compute-2.0-design.md"
      - "docs/superpowers/plans/2026-08-23-milyvoice-3-compute-2.0.md"
  push:
    branches:
      - "v3/compute-*"
    paths:
      - "crates/mily-compute/**"
      - "contracts/compute/**"
      - "contracts/index.json"
      - "manifests/milyvoice-3.components.json"
      - "scripts/test_v3_component_manifest.py"
      - ".github/workflows/v3-compute.yml"

permissions:
  contents: read

jobs:
  linux:
    name: Compute Linux gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rust 1.98.0
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Compute tests
        run: cargo test -p mily-compute --locked

      - name: Compute Clippy
        run: cargo clippy -p mily-compute --all-targets --locked -- -D warnings

  windows:
    name: Compute Windows gate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rust 1.98.0
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Compute tests
        run: cargo test -p mily-compute --locked

  contracts:
    name: Compute contract/composition gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Contracts registry
        run: python scripts/test_v3_contracts.py

      - name: V3 composition
        run: python scripts/test_v3_component_manifest.py
