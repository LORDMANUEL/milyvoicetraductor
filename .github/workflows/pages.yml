name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Configure GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Explain Pages enablement requirement
        if: steps.pages.outcome != 'success'
        shell: bash
        run: |
          echo "::warning title=GitHub Pages pendiente::GitHub bloqueó la creación inicial del sitio para GITHUB_TOKEN. Habilita Pages una sola vez en Settings > Pages > Source: GitHub Actions; después este workflow desplegará automáticamente."
      - name: Upload static site
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/site
      - name: Deploy
        if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v5
