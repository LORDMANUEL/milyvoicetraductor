name: Publish 2.0.2 Stable

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-stable-v2.0.2
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified 2.0.2 stable downloads
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'stable/2.0.x' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
      ARTIFACT_NAME: MilyVoiceTraductor-Full-2.0.2-Windows-x64-${{ github.event.workflow_run.head_sha }}
      RELEASE_TAG: v2.0.2
      RELEASE_TITLE: MilyVoiceTraductor 2.0.2
    steps:
      - name: Checkout the verified stable source revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download the exact Windows artifact produced by stable CI
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release
          gh run download "$RUN_ID" --repo "$REPOSITORY" --name "$ARTIFACT_NAME" --dir release

      - name: Verify stable file set and SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          test -f release/MilyVoiceTraductor_2.0.2_x64-setup.exe
          test -f release/MilyVoiceTraductor-Chromium-Extension.zip
          test -f release/MilyVoiceTraductor-2.0.2-MegaBench.json
          test -f release/SHA256SUMS.txt
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 4
          cd release
          sha256sum -c SHA256SUMS.txt

      - name: Create once or verify immutable stable 2.0.2 release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            existing_target="$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json targetCommitish --jq '.targetCommitish')"
            test "$existing_target" = "$VERIFIED_SHA"

            release_state="$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json isDraft,isPrerelease --jq '[.isDraft,.isPrerelease] | @tsv')"
            test "$release_state" = $'false\tfalse'

            rm -rf existing-release
            mkdir -p existing-release
            gh release download "$RELEASE_TAG" --repo "$REPOSITORY" --dir existing-release

            test -f existing-release/MilyVoiceTraductor_2.0.2_x64-setup.exe
            test -f existing-release/MilyVoiceTraductor-Chromium-Extension.zip
            test -f existing-release/MilyVoiceTraductor-2.0.2-MegaBench.json
            test -f existing-release/SHA256SUMS.txt
            test "$(find existing-release -maxdepth 1 -type f | wc -l)" -eq 4
            (
              cd existing-release
              sha256sum -c SHA256SUMS.txt
            )
            cmp release/SHA256SUMS.txt existing-release/SHA256SUMS.txt
            echo "v2.0.2 ya existe y coincide exactamente con el SHA/artefacto verificado; no se modifica."
          else
            gh release create "$RELEASE_TAG" release/* --repo "$REPOSITORY" \
              --target "$VERIFIED_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file docs/release/RELEASE_NOTES_2.0.2.md \
              --latest
          fi

      - name: Confirm stable release assets and target
        shell: bash
        run: |
          set -euo pipefail
          assets="$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json assets --jq '.assets[].name')"
          grep -Fxq 'MilyVoiceTraductor_2.0.2_x64-setup.exe' <<<"$assets"
          grep -Fxq 'MilyVoiceTraductor-Chromium-Extension.zip' <<<"$assets"
          grep -Fxq 'MilyVoiceTraductor-2.0.2-MegaBench.json' <<<"$assets"
          grep -Fxq 'SHA256SUMS.txt' <<<"$assets"
          meta="$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json url,isPrerelease,targetCommitish --jq '{url:.url,isPrerelease:.isPrerelease,targetCommitish:.targetCommitish}')"
          grep -Fq "\"targetCommitish\":\"$VERIFIED_SHA\"" <<<"$meta"
          grep -Fq '"isPrerelease":false' <<<"$meta"
          echo "$meta"
