name: V3 ASR

on:
  pull_request:
    paths:
      - "services/asr/**"
      - "contracts/asr/**"
      - "contracts/index.json"
      - "manifests/milyvoice-3.components.json"
      - "scripts/test_v3_component_manifest.py"
      - ".github/workflows/v3-asr.yml"
      - "docs/superpowers/specs/2026-08-24-milyvoice-3-asr-1.0-design.md"
      - "docs/superpowers/plans/2026-08-24-milyvoice-3-asr-1.0.md"
  push:
    branches:
      - "v3/asr-*"
    paths:
      - "services/asr/**"
      - "contracts/asr/**"
      - "contracts/index.json"
      - "manifests/milyvoice-3.components.json"
      - "scripts/test_v3_component_manifest.py"
      - ".github/workflows/v3-asr.yml"

permissions:
  contents: read

jobs:
  linux:
    name: ASR Linux gate
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: services/asr:services/engine_host:services/realtime:services/ai
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compile ASR sources and tests
        run: python -m compileall -q services/asr
      - name: ASR tests
        run: python -m unittest discover -s services/asr/tests -p "test_*.py" -v

  windows:
    name: ASR Windows gate
    runs-on: windows-latest
    env:
      PYTHONPATH: "services/asr;services/engine_host;services/realtime;services/ai"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compile ASR sources and tests
        run: python -m compileall -q services/asr
      - name: ASR tests
        run: python -m unittest discover -s services/asr/tests -p "test_*.py" -v

  contracts:
    name: ASR contract/composition gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Contracts registry
        run: python scripts/test_v3_contracts.py
      - name: V3 composition
        run: python scripts/test_v3_component_manifest.py
