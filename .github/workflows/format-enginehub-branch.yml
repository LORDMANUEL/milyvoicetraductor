name: Format Engine Hub branch

on:
  push:
    branches:
      - agent/enginehub-final-fixes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-enginehub-final-fixes
  cancel-in-progress: true

jobs:
  rustfmt:
    if: ${{ !contains(github.event.head_commit.message, '[rustfmt applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply canonical formatting
        run: cargo fmt --all
      - name: Commit formatted sources
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style: apply rustfmt [rustfmt applied]"
          git push origin HEAD:agent/enginehub-final-fixes
