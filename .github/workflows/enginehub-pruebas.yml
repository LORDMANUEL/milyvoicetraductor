name: Apply Engine Hub audit patch

on:
  pull_request:
    branches: [pruebas]

permissions:
  contents: write

concurrency:
  group: apply-enginehub-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    if: ${{ !contains(github.event.pull_request.head.sha, '0000000') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/enginehub-memory-selection-fix
          fetch-depth: 0
      - name: Apply audit corrections
        run: python scripts/apply_enginehub_audit_fixes.py
      - name: Commit patched sources
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Audit corrections already applied."
            exit 0
          fi
          cargo fmt --all
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/ai/mily_ai crates .github/workflows/enginehub-pruebas.yml
          git commit -m "fix: close Engine Hub audit gaps [enginehub audit applied]"
          git push origin HEAD:agent/enginehub-memory-selection-fix
