name: Engine Hub fast preflight

on:
  push:
    branches: [pruebas]

permissions:
  contents: write

concurrency:
  group: enginehub-pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize-and-preflight:
    name: Finalize 2.1.0 / Ubuntu preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Finalize active 2.1.0 metadata
        run: python scripts/finalize_2_1.py

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check "fastapi>=0.116,<1" "httpx>=0.28,<1" "numpy>=2.2,<3"

      - name: Release, source, privacy, extension and site guards
        run: |
          python scripts/test_release_version.py
          python scripts/verify_source.py
          python scripts/privacy_scan.py .
          python scripts/test_extension.py
          python scripts/test_site.py

      - name: AI and translation optimization regressions
        env:
          PYTHONPATH: services/ai
        run: |
          python -m unittest discover -s services/ai/tests -p "test_marian_fast_cache.py" -v
          python -m unittest discover -s services/ai/tests -p "test_provider_factory.py" -v
          python -m unittest discover -s services/ai/tests -p "test_realtime_optimization.py" -v
          python -m unittest discover -s services/ai/tests -p "test_translation_quality.py" -v
          python -m unittest discover -s services/ai/tests -p "test_engine_hub_ci_release_policy.py" -v
          python -m unittest discover -s services/ai/tests -p "test_engine_hub_target_machine.py" -v
          python -m unittest discover -s services/ai/tests -p "test_resource_governor.py" -v
          python -m unittest discover -s services/ai/tests -p "test_realtime_telemetry.py" -v
          python -m compileall -q services/ai

      - name: Frontend typecheck tests and build
        run: |
          npm install --global npm@10.9.9
          npm install --prefix apps/desktop --workspaces=false --legacy-peer-deps --no-audit --no-fund
          npm run --prefix apps/desktop typecheck
          npm run --prefix apps/desktop test
          npm run --prefix apps/desktop build

      - name: Rust formatting tests and Clippy
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --exclude milyvoicetraductor-desktop
          cargo clippy --workspace --all-targets --exclude milyvoicetraductor-desktop -- -D warnings

      - name: Restore permanent workflow and remove temporary finalizers
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/workflows/enginehub-pruebas.yml > .github/workflows/enginehub-pruebas.yml
          rm -f .github/workflows/release-2.1-finalize.yml scripts/finalize_2_1.py
          git diff --check

      - name: Commit exact certified candidate to pruebas
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: finalize MilyVoiceTraductor 2.1.0 [certified-preflight]'
          git push origin HEAD:pruebas
