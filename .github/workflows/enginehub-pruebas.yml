name: Engine Hub fast preflight

on:
  push:
    branches: [pruebas]
  pull_request:
    branches: [pruebas]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enginehub-pruebas-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

# Cola de pruebas histórica en proceso de limpieza. Este commit existe para que
# GitHub cree una nueva ejecución en el mismo concurrency group, cancele las
# anteriores y no solicite ningún runner. Después se dejará solo workflow_dispatch.
jobs:
  target-machine:
    name: Engine Hub preflight / paused
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "paused"

  rustfmt:
    name: Rust formatting gate / paused
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "paused"
