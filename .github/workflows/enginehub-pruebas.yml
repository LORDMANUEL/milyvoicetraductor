name: Generate Engine Hub Cargo lockfile

on:
  pull_request:
    branches: [pruebas]

permissions:
  contents: write

concurrency:
  group: generate-enginehub-lockfile
  cancel-in-progress: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    env:
      CARGO_NET_RETRY: 10
      CARGO_HTTP_TIMEOUT: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/enginehub-memory-selection-fix
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate the exact workspace dependency lock
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if cargo generate-lockfile; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "cargo generate-lockfile failed after $attempt attempts" >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
      - name: Commit Cargo.lock to the pruebas candidate
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock && git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            echo "Cargo.lock already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: lock Engine Hub Rust dependencies"
          git push origin HEAD:agent/enginehub-memory-selection-fix
