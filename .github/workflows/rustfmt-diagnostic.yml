name: Rustfmt diagnostic

on:
  push:
    branches: [pruebas]

permissions:
  contents: read

jobs:
  rustfmt-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Generate rustfmt patch
        shell: bash
        run: |
          cargo fmt --all
          git diff --binary > rustfmt.patch
          echo "Changed files:"
          git diff --name-only
      - name: Upload rustfmt patch
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: rustfmt.patch
          if-no-files-found: error
