name: Apply rustfmt to pruebas

on:
  push:
    branches: [agent/enginehub-ci-1032-fixes]

permissions:
  contents: write

concurrency:
  group: apply-rustfmt-pruebas
  cancel-in-progress: true

jobs:
  format-base:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pruebas
        uses: actions/checkout@v5
        with:
          ref: pruebas
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and commit only when required
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if git diff --quiet; then
            echo "pruebas already matches canonical rustfmt."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style: apply canonical rustfmt on pruebas"
          git push origin HEAD:pruebas
