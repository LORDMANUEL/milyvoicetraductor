name: Patch deterministic provider unload

on:
  push:
    branches: [agent/enginehub-memory-selection-fix]

permissions:
  contents: write

concurrency:
  group: patch-provider-unload
  cancel-in-progress: true

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[provider unload applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/enginehub-memory-selection-fix
          fetch-depth: 0
      - name: Add deterministic release of ASR and translation models
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('services/ai/mily_ai/providers.py')
          text = path.read_text(encoding='utf-8')

          helper_marker = 'from .cpu_budget import CpuBudget, detect_cpu_budget\n\n\n'
          helpers = '''from .cpu_budget import CpuBudget, detect_cpu_budget\n\n\ndef _release_ctranslate2_model(value) -> None:\n    """Libera pesos nativos de CTranslate2 antes de soltar referencias Python."""\n\n    if value is None:\n        return\n    candidates = (value, getattr(value, "model", None))\n    seen: set[int] = set()\n    for candidate in candidates:\n        if candidate is None or id(candidate) in seen:\n            continue\n        seen.add(id(candidate))\n        unload = getattr(candidate, "unload_model", None)\n        if not callable(unload):\n            continue\n        try:\n            unload(to_cpu=False)\n        except TypeError:\n            unload()\n        except Exception:\n            # La referencia se elimina igualmente; no se debe bloquear el cierre.\n            pass\n\n\ndef _release_torch_cuda_cache(device: str) -> None:\n    if device != "cuda":\n        return\n    try:\n        import torch\n\n        torch.cuda.empty_cache()\n    except (ImportError, RuntimeError, AttributeError):\n        pass\n\n\n'''
          if '_release_ctranslate2_model' not in text:
              if helper_marker not in text:
                  raise SystemExit('Provider helper insertion point not found')
              text = text.replace(helper_marker, helpers, 1)

          cached_marker = '''        while len(self._cache) > self.max_entries:\n            self._cache.popitem(last=False)\n        return value\n\n\nclass FasterWhisperAsr'''
          cached_replacement = '''        while len(self._cache) > self.max_entries:\n            self._cache.popitem(last=False)\n        return value\n\n    def unload(self) -> None:\n        self._cache.clear()\n        unload = getattr(self.inner, "unload", None)\n        if callable(unload):\n            unload()\n\n\nclass FasterWhisperAsr'''
          if 'class CachedTranslator' in text and 'self._cache.clear()' not in text:
              if cached_marker not in text:
                  raise SystemExit('CachedTranslator insertion point not found')
              text = text.replace(cached_marker, cached_replacement, 1)

          whisper_marker = '        return output\n\n\nclass M2M100CTranslate2Translator'
          whisper_replacement = '''        return output\n\n    def unload(self) -> None:\n        _release_ctranslate2_model(self._model)\n        self._model = None\n        self._locked_language = None\n        self._warmed = False\n        self.selected_device = None\n        self.fallback_used = False\n        self.fallback_reason = ""\n\n\nclass M2M100CTranslate2Translator'''
          if 'def unload(self) -> None:\n        _release_ctranslate2_model(self._model)' not in text:
              if whisper_marker not in text:
                  raise SystemExit('FasterWhisper insertion point not found')
              text = text.replace(whisper_marker, whisper_replacement, 1)

          m2m_marker = '''        return self._tokenizer.decode(token_ids, skip_special_tokens=True).strip()\n\n\nclass NllbTranslator'''
          m2m_replacement = '''        return self._tokenizer.decode(token_ids, skip_special_tokens=True).strip()\n\n    def unload(self) -> None:\n        _release_ctranslate2_model(self._translator)\n        self._translator = None\n        self._tokenizer = None\n        self._warmed = False\n        self.selected_device = None\n        self.fallback_used = False\n        self.fallback_reason = ""\n\n\nclass NllbTranslator'''
          if 'def unload(self) -> None:\n        _release_ctranslate2_model(self._translator)' not in text:
              if m2m_marker not in text:
                  raise SystemExit('M2M100 insertion point not found')
              text = text.replace(m2m_marker, m2m_replacement, 1)

          nllb_marker = '''        return self._tokenizer.batch_decode(\n            generated, skip_special_tokens=True\n        )[0].strip()\n\n\nclass QwenTranslator'''
          nllb_replacement = '''        return self._tokenizer.batch_decode(\n            generated, skip_special_tokens=True\n        )[0].strip()\n\n    def unload(self) -> None:\n        device = self._device\n        self._model = None\n        self._tokenizer = None\n        self._device = "cpu"\n        _release_torch_cuda_cache(device)\n\n\nclass QwenTranslator'''
          if nllb_marker in text:
              text = text.replace(nllb_marker, nllb_replacement, 1)

          qwen_tail = '''        new_tokens = output[0][inputs["input_ids"].shape[1] :]\n        return self._tokenizer.decode(new_tokens, skip_special_tokens=True).strip()\n'''
          qwen_replacement = '''        new_tokens = output[0][inputs["input_ids"].shape[1] :]\n        return self._tokenizer.decode(new_tokens, skip_special_tokens=True).strip()\n\n    def unload(self) -> None:\n        device = self._device\n        self._model = None\n        self._tokenizer = None\n        self._device = "cpu"\n        _release_torch_cuda_cache(device)\n'''
          if qwen_tail in text and text.count('_release_torch_cuda_cache(device)') < 2:
              text = text.replace(qwen_tail, qwen_replacement, 1)

          path.write_text(text, encoding='utf-8')

          pipeline = Path('services/ai/mily_ai/pipeline.py')
          ptext = pipeline.read_text(encoding='utf-8')
          old = '        for provider in (self.asr, self._translator_provider):\n'
          new = '        for provider in (self.asr, self.translator):\n'
          if old in ptext:
              ptext = ptext.replace(old, new, 1)
              pipeline.write_text(ptext, encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/ai/mily_ai/providers.py services/ai/mily_ai/pipeline.py
          git commit -m "perf: release inactive models deterministically [provider unload applied]"
          git push origin HEAD:agent/enginehub-memory-selection-fix
