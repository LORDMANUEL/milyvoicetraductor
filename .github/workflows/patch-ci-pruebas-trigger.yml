name: Patch full CI trigger for pruebas

on:
  push:
    branches: [agent/enginehub-lite-release-gates-v2]

permissions:
  contents: write

concurrency:
  group: patch-ci-pruebas-trigger
  cancel-in-progress: true

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[ci pruebas trigger applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/enginehub-lite-release-gates-v2
          fetch-depth: 0
      - name: Enable complete CI for main and pruebas
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace('    branches: [main]\n', '    branches: [main, pruebas]\n', 2)
          if text.count('    branches: [main, pruebas]\n') < 2:
              raise SystemExit('CI trigger patch did not find both push/pull_request blocks')
          path.write_text(text, encoding='utf-8')
          PY
          if git diff --quiet; then
            echo "Complete CI already targets pruebas."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git commit -m "ci: run complete validation on pruebas [ci pruebas trigger applied]"
          git push origin HEAD:agent/enginehub-lite-release-gates-v2
