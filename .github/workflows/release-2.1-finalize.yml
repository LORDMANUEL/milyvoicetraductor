name: Finalize 2.1.0 candidate

on:
  push:
    branches: [release/2.1.0-final]

permissions:
  contents: write

concurrency:
  group: finalize-2.1.0
  cancel-in-progress: true

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[release-finalized]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/2.1.0-final
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Finalize active version metadata
        run: python scripts/finalize_2_1.py

      - name: Install lightweight Python validation dependencies
        run: python -m pip install --disable-pip-version-check "fastapi>=0.116,<1" "httpx>=0.28,<1" "numpy>=2.2,<3"

      - name: Release and source guards
        run: |
          python scripts/test_release_version.py
          python scripts/verify_source.py
          python scripts/privacy_scan.py .
          python scripts/test_extension.py
          python scripts/test_site.py

      - name: Translation optimization regression tests
        env:
          PYTHONPATH: services/ai
        run: |
          python -m unittest services.ai.tests.test_marian_fast_cache -v
          python services/ai/tests/test_provider_factory.py
          python services/ai/tests/test_realtime_optimization.py
          python services/ai/tests/test_translation_quality.py
          python services/ai/tests/test_engine_hub_ci_release_policy.py
          python -m compileall -q services/ai

      - name: Frontend typecheck tests and build
        run: |
          npm install --global npm@10.9.9
          npm install --prefix apps/desktop --workspaces=false --legacy-peer-deps --no-audit --no-fund
          npm run --prefix apps/desktop typecheck
          npm run --prefix apps/desktop test
          npm run --prefix apps/desktop build

      - name: Rust formatting tests and Clippy
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --exclude milyvoicetraductor-desktop
          cargo clippy --workspace --all-targets --exclude milyvoicetraductor-desktop -- -D warnings

      - name: Verify clean patch and remove temporary finalizer
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm -f .github/workflows/release-2.1-finalize.yml scripts/finalize_2_1.py
          git diff --check

      - name: Commit the fully validated candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to finalize.'
            exit 0
          fi
          git commit -m 'release: finalize MilyVoiceTraductor 2.1.0 [release-finalized]'
          git push origin HEAD:release/2.1.0-final
