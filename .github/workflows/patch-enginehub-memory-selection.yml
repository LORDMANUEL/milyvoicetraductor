name: Patch Engine Hub memory selection

on:
  push:
    branches: [agent/enginehub-memory-selection-fix]

permissions:
  contents: write

concurrency:
  group: patch-enginehub-memory-selection
  cancel-in-progress: true

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[memory selection applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/enginehub-memory-selection-fix
          fetch-depth: 0
      - name: Enforce measured total product memory and current Clippy rules
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          registry = Path('services/ai/mily_ai/engine_registry.py')
          text = registry.read_text(encoding='utf-8')
          text = text.replace(
              'from .resource_governor import ResourceGovernor\n',
              'from .resource_governor import ResourceGovernor, RuntimeFootprint\n',
              1,
          )
          text = text.replace(
              '    shared_gpu_mb: float = 0.0\n\n    def __post_init__(self) -> None:\n',
              '    shared_gpu_mb: float = 0.0\n    total_product_mb: float = 0.0\n\n    def __post_init__(self) -> None:\n',
              1,
          )
          text = text.replace(
              '        memory = (self.ram_mb, self.vram_mb, self.shared_gpu_mb)\n',
              '        memory = (\n            self.ram_mb,\n            self.vram_mb,\n            self.shared_gpu_mb,\n            self.total_product_mb,\n        )\n',
              1,
          )
          text = text.replace(
              '        total_ram_mb = (\n            float(candidate.ram_mb)\n            + float(candidate.shared_gpu_mb)\n            + float(self.resource_governor.limits.product_reserve_mb)\n        )\n',
              '        total_ram_mb = (\n            float(candidate.total_product_mb)\n            if candidate.total_product_mb > 0\n            else (\n                float(candidate.ram_mb)\n                + float(candidate.shared_gpu_mb)\n                + float(self.resource_governor.limits.product_reserve_mb)\n            )\n        )\n',
              1,
          )
          old_resource = '''            resource = self.resource_governor.preflight_model(\n                model_ram_mb=candidate.ram_mb,\n                shared_gpu_mb=candidate.shared_gpu_mb,\n                dedicated_vram_mb=candidate.vram_mb,\n            )\n'''
          new_resource = '''            resource = (\n                self.resource_governor.evaluate(\n                    RuntimeFootprint(\n                        process_mb=candidate.total_product_mb,\n                        dedicated_vram_mb=candidate.vram_mb,\n                    )\n                )\n                if candidate.total_product_mb > 0\n                else self.resource_governor.preflight_model(\n                    model_ram_mb=candidate.ram_mb,\n                    shared_gpu_mb=candidate.shared_gpu_mb,\n                    dedicated_vram_mb=candidate.vram_mb,\n                )\n            )\n'''
          if old_resource not in text:
              raise SystemExit('EngineRegistry resource block not found')
          text = text.replace(old_resource, new_resource, 1)
          registry.write_text(text, encoding='utf-8')

          advisor = Path('services/ai/mily_ai/model_advisor.py')
          text = advisor.read_text(encoding='utf-8')
          marker = '        measured_ram = self._engine_ram_from_report(report)\n'
          replacement = marker + '''        measured_total_product = _finite_non_negative(\n            report.get("totalProductWorkingSetMb", 0.0), 0.0\n        )\n'''
          if marker not in text:
              raise SystemExit('ModelAdvisor measured RAM marker not found')
          text = text.replace(marker, replacement, 1)
          marker = '            shared_gpu_mb=_finite_non_negative(\n                definition.get("sharedGpuMb", 0), 0.0\n            ),\n'
          replacement = marker + '            total_product_mb=measured_total_product,\n'
          if marker not in text:
              raise SystemExit('ModelAdvisor candidate marker not found')
          text = text.replace(marker, replacement, 1)
          advisor.write_text(text, encoding='utf-8')

          bridge = Path('crates/mily-bridge/src/whispercpp.rs')
          text = bridge.read_text(encoding='utf-8')
          old = '        || pcm_length % 4 != 0\n'
          new = '        || !pcm_length.is_multiple_of(4)\n'
          if old not in text:
              raise SystemExit('Clippy modulo expression not found')
          bridge.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          cargo fmt --all
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/ai/mily_ai/engine_registry.py services/ai/mily_ai/model_advisor.py crates/mily-bridge/src/whispercpp.rs
          git commit -m "fix: enforce measured total product memory [memory selection applied]"
          git push origin HEAD:agent/enginehub-memory-selection-fix
