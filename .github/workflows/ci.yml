name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-guards:
    name: Privacy, extension and site guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install source-verification dependencies
        run: python -m pip install --disable-pip-version-check "fastapi>=0.116,<1" "httpx>=0.28,<1" "numpy>=2.2,<3"
      - name: Release version consistency
        run: python3 scripts/test_release_version.py
      - name: Source verification
        run: python3 scripts/verify_source.py
      - name: Privacy scan
        run: python3 scripts/privacy_scan.py .
      - name: Chromium extension guard
        run: python3 scripts/test_extension.py
      - name: GitHub Pages smoke test
        run: python3 scripts/test_site.py

  ai-engine:
    name: Local AI engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install lightweight test dependencies
        run: python -m pip install --disable-pip-version-check "fastapi>=0.116,<1" "httpx>=0.28,<1" "numpy>=2.2,<3"
      - name: Unit and local server tests
        env:
          PYTHONPATH: services/ai
        run: python scripts/run_ai_tests.py --timeout 120
      - name: Realtime stress and MegaBench contracts
        env:
          PYTHONPATH: services/ai
        run: |
          python services/ai/tests/test_benchmarking.py
          python services/ai/tests/test_realtime_optimization.py
          python services/ai/tests/test_realtime_queueing.py
          python services/ai/tests/test_realtime_telemetry.py
          python services/ai/tests/test_cpu_budget.py
      - name: Compile Python sources
        run: python -m compileall -q services/ai

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Pin npm
        run: npm install --global npm@10.9.9
      - name: Install frontend dependencies
        run: npm install --prefix apps/desktop --workspaces=false --legacy-peer-deps --no-audit --no-fund
      - name: Typecheck
        run: npm run --prefix apps/desktop typecheck
      - name: Tests
        run: npm run --prefix apps/desktop test
      - name: Build
        run: npm run --prefix apps/desktop build

  rust:
    name: Rust core Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        id: rustfmt
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --all -- --check 2>&1 | tee rustfmt.log
      - name: Annotate rustfmt diagnostics
        if: failure() && steps.rustfmt.outcome == 'failure'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          text = Path('rustfmt.log').read_text(encoding='utf-8', errors='replace')
          tail = '\n'.join(text.splitlines()[-120:])[-9000:]
          workspace = os.environ.get('GITHUB_WORKSPACE', '')
          if workspace:
              tail = tail.replace(workspace, '<WORKSPACE>')
          escaped = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=rustfmt diagnostics::{escaped}')
          PY
      - name: Core tests
        if: success()
        run: cargo test --workspace --exclude milyvoicetraductor-desktop
      - name: Core Clippy
        if: success()
        run: cargo clippy --workspace --all-targets --exclude milyvoicetraductor-desktop -- -D warnings
      - name: Upload Rust diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: MilyVoiceTraductor-Rust-Diagnostics-${{ github.sha }}
          path: rustfmt.log
          retention-days: 14
          if-no-files-found: ignore

  windows-smoke:
    name: Windows release smoke
    if: github.event_name == 'push' || github.event.action == 'ready_for_review'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Pin npm
        run: npm install --global npm@10.9.9
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install frontend dependencies
        run: npm install --prefix apps/desktop --workspaces=false --legacy-peer-deps --no-audit --no-fund
      - name: Frontend build
        run: npm run --prefix apps/desktop build
      - name: Install lightweight AI test dependencies
        run: python -m pip install --disable-pip-version-check "fastapi>=0.116,<1" "httpx>=0.28,<1" "numpy>=2.2,<3"
      - name: AI unit tests
        id: windows_ai
        shell: pwsh
        run: |
          $output = & python scripts/run_ai_tests.py --timeout 120 2>&1
          $code = $LASTEXITCODE
          $output | Tee-Object -FilePath ai-windows.log
          if ($code -ne 0) { exit $code }
      - name: Offline bootstrap policy
        if: success()
        shell: pwsh
        run: .\installer\windows\test-bootstrap.ps1
      - name: Native Messaging bridge release build
        if: success()
        run: cargo build -p mily-bridge --release
      - name: Build private Python 3.13 runtime
        if: success()
        shell: pwsh
        run: .\installer\windows\build-python-runtime.ps1
      - name: Validate embedded runtime and offline bootstrap
        if: success()
        shell: pwsh
        run: .\installer\windows\test-bootstrap.ps1 -RequireRuntime
      - name: Exercise installed runtime, bridge and registration
        if: success()
        shell: pwsh
        run: .\installer\windows\test-installed-flow.ps1
      - name: Engine Hub target-machine simulation
        if: success()
        shell: pwsh
        run: .\installer\windows\test-engine-hub-target-machine.ps1
      - name: Quality pack policy under 2 GiB
        if: success()
        shell: pwsh
        run: .\installer\windows\test-quality-pack-policy.ps1
      - name: Moonshine Lite real EN to ES benchmark
        if: success()
        shell: pwsh
        run: .\installer\windows\test-moonshine-lite.ps1
      - name: Whisper Tiny Lite real EN to ES benchmark
        if: success()
        shell: pwsh
        run: .\installer\windows\test-whisper-tiny-lite.ps1
      - name: Mandarin Lite real ZH to ES benchmark
        if: success()
        shell: pwsh
        run: .\installer\windows\test-zh-es-lite.ps1
      - name: Rust tests
        if: success()
        run: cargo test --workspace
      - name: Clippy
        if: success()
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Windows desktop release build
        if: success()
        run: cargo build -p milyvoicetraductor-desktop --release
      - name: Verify Windows GUI subsystem
        if: success()
        shell: pwsh
        run: .\installer\windows\test-windows-gui.ps1
      - name: Tauri NSIS bundle
        if: success()
        run: npm run --prefix apps/desktop tauri -- build
      - name: Exercise generated NSIS installer
        if: success()
        shell: pwsh
        run: .\installer\windows\test-nsis-installer.ps1
      - name: Package Chromium extension
        if: success()
        run: python scripts/build_extension_zip.py
      - name: Prepare release bundle and SHA-256 checksums
        if: success()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist/release" | Out-Null
          $installer = Get-ChildItem "target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "No se encontró el instalador NSIS generado." }
          $extension = Get-Item "dist/MilyVoiceTraductor-Chromium-Extension.zip"
          $targetSimulation = Get-Item "dist/performance/MilyVoiceTraductor-2.0.1-TargetMachineSimulation.json"
          $moonshineBench = Get-Item "dist/performance/MilyVoiceTraductor-2.0.1-MoonshineLiteBench.json"
          $whisperTinyBench = Get-Item "dist/performance/MilyVoiceTraductor-2.0.1-WhisperTinyLiteBench.json"
          $zhEsBench = Get-Item "dist/performance/MilyVoiceTraductor-2.0.1-ZhEsLiteBench.json"
          Copy-Item $installer.FullName "dist/release/$($installer.Name)"
          Copy-Item $extension.FullName "dist/release/$($extension.Name)"
          Copy-Item $targetSimulation.FullName "dist/release/$($targetSimulation.Name)"
          Copy-Item $moonshineBench.FullName "dist/release/$($moonshineBench.Name)"
          Copy-Item $whisperTinyBench.FullName "dist/release/$($whisperTinyBench.Name)"
          Copy-Item $zhEsBench.FullName "dist/release/$($zhEsBench.Name)"
          $lines = foreach ($file in Get-ChildItem "dist/release" -File) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($file.Name)"
          }
          $lines | Set-Content -Encoding ascii "dist/release/SHA256SUMS.txt"
      - name: Collect sanitized diagnostics
        if: always()
        shell: pwsh
        run: |
          $diagnostics = "dist/diagnostics"
          New-Item -ItemType Directory -Force $diagnostics | Out-Null
          if (Test-Path "ai-windows.log") { Copy-Item "ai-windows.log" "$diagnostics/ai-windows.log" -Force }
          if (Test-Path "dist/performance") { Copy-Item "dist/performance" "$diagnostics/performance" -Recurse -Force }
          if (Test-Path "dist/runtime/runtime-manifest.json") { Copy-Item "dist/runtime/runtime-manifest.json" "$diagnostics/runtime-manifest.json" -Force }
          $appRoot = Join-Path $env:LOCALAPPDATA "MilyVoiceTraductor"
          $status = Join-Path $appRoot "bootstrap/status.json"
          if (Test-Path $status) { Copy-Item $status "$diagnostics/bootstrap-status.json" -Force }
          $logs = Join-Path $appRoot "logs"
          if (Test-Path $logs) {
            Get-ChildItem $logs -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '^(milyvoice|ai-engine|repair-history)' } |
              ForEach-Object { Copy-Item $_.FullName (Join-Path $diagnostics $_.Name) -Force }
          }
          [ordered]@{
            schemaVersion = 1
            sha = $env:GITHUB_SHA
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            workflow = $env:GITHUB_WORKFLOW
            job = $env:GITHUB_JOB
          } | ConvertTo-Json | Set-Content "$diagnostics/run-context.json" -Encoding UTF8
      - name: Upload diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: MilyVoiceTraductor-Diagnostics-${{ github.sha }}
          path: dist/diagnostics/*
          retention-days: 14
          compression-level: 6
          if-no-files-found: warn
      - name: Upload verified Windows installer, extension and Lite benchmark evidence
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: MilyVoiceTraductor-Full-2.0.1-Windows-x64-${{ github.sha }}
          path: dist/release/*
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
