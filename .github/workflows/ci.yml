name: CI

on:
  push:
    branches: [main, "agent/**", "feat/**", "release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-guards:
    name: Privacy, extension and site guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Source verification
        run: python3 scripts/verify_source.py
      - name: Privacy scan
        run: python3 scripts/privacy_scan.py .
      - name: Chromium extension guard
        run: python3 scripts/test_extension.py
      - name: GitHub Pages smoke test
        run: python3 scripts/test_site.py

  ai-engine:
    name: Local AI engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install lightweight test dependencies
        run: python -m pip install --disable-pip-version-check "fastapi>=0.116,<1" "httpx>=0.28,<1"
      - name: Unit and local server tests
        env:
          PYTHONPATH: services/ai
        run: python -m unittest discover -s services/ai/tests -v
      - name: Compile Python sources
        run: python -m compileall -q services/ai

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install frontend dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  rust:
    name: Rust / Tauri Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Release build
        run: cargo build -p milyvoicetraductor-desktop --release

  windows-smoke:
    name: Windows release smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install frontend dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci --no-audit --no-fund } else { npm install --no-audit --no-fund }
      - name: Frontend build
        run: npm run build
      - name: AI unit tests
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "fastapi>=0.116,<1" "httpx>=0.28,<1"
          $env:PYTHONPATH = "services/ai"
          python -m unittest discover -s services/ai/tests -v
      - name: Rust tests
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Windows release build
        run: cargo build -p milyvoicetraductor-desktop --release
      - name: Tauri NSIS bundle
        run: npm run tauri -- build
