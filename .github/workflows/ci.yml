name: CI

on:
  push:
    branches: [main, pruebas]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-guards:
    name: Privacy, extension and site guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Release version consistency
        run: python3 scripts/test_release_version.py
      - name: Source verification
        run: python3 scripts/verify_source.py
      - name: Privacy scan
        run: python3 scripts/privacy_scan.py .
      - name: Chromium extension guard
        run: python3 scripts/test_extension.py
      - name: GitHub Pages smoke test
        run: python3 scripts/test_site.py

  ai-engine:
    name: Local AI engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install lightweight test dependencies
        run: python -m pip install --disable-pip-version-check "fastapi>=0.116,<1" "httpx>=0.28,<1" "numpy>=2.2,<3"
      - name: Unit and local server tests
        env:
          PYTHONPATH: services/ai
        run: python -m unittest discover -s services/ai/tests -v
      - name: Compile Python sources
        run: python -m compileall -q services/ai

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install frontend dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund || {
              echo "npm ci falló una vez; limpiando caché y reintentando exactamente una vez."
              npm cache clean --force
              npm ci --no-audit --no-fund
            }
          else
            npm install --no-audit --no-fund
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  rust:
    name: Rust / Tauri Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        id: rustfmt
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --all -- --check 2>&1 | tee rustfmt.log
      - name: Annotate rustfmt diagnostics
        if: failure() && steps.rustfmt.outcome == 'failure'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          text = Path('rustfmt.log').read_text(encoding='utf-8', errors='replace')
          tail = '\n'.join(text.splitlines()[-120:])[-9000:]
          workspace = os.environ.get('GITHUB_WORKSPACE', '')
          if workspace:
              tail = tail.replace(workspace, '<WORKSPACE>')
          escaped = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=rustfmt diagnostics::{escaped}')
          PY
      - name: Tests
        if: success()
        run: cargo test --workspace
      - name: Clippy
        if: success()
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Release build
        if: success()
        run: cargo build -p milyvoicetraductor-desktop --release

  windows-smoke:
    name: Windows release smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install frontend dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) {
              Write-Host "npm ci falló una vez; limpiando caché y reintentando exactamente una vez."
              npm cache clean --force
              npm ci --no-audit --no-fund
            }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Frontend build
        run: npm run build
      - name: Install lightweight AI test dependencies
        run: python -m pip install --disable-pip-version-check "fastapi>=0.116,<1" "httpx>=0.28,<1" "numpy>=2.2,<3"
      - name: AI unit tests
        id: windows_ai
        shell: pwsh
        run: |
          Push-Location services/ai
          try {
            $output = & python -m unittest discover -s tests -v 2>&1
            $code = $LASTEXITCODE
            $output | Tee-Object -FilePath ../../ai-windows.log
            if ($code -ne 0) { exit $code }
          } finally {
            Pop-Location
          }
      - name: Offline bootstrap policy
        if: success()
        shell: pwsh
        run: .\installer\windows\test-bootstrap.ps1
      - name: Native Messaging bridge release build
        if: success()
        run: cargo build -p mily-bridge --release
      - name: Build private Python 3.13 runtime
        if: success()
        shell: pwsh
        run: .\installer\windows\build-python-runtime.ps1
      - name: Validate embedded runtime and offline bootstrap
        if: success()
        shell: pwsh
        run: .\installer\windows\test-bootstrap.ps1 -RequireRuntime
      - name: Exercise installed runtime, bridge and registration
        if: success()
        shell: pwsh
        run: .\installer\windows\test-installed-flow.ps1
      - name: Exercise real realtime model pack
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: .\installer\windows\test-realtime-model.ps1
      - name: Rust tests
        if: success()
        run: cargo test --workspace
      - name: Clippy
        if: success()
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Windows desktop release build
        if: success()
        run: cargo build -p milyvoicetraductor-desktop --release
      - name: Verify Windows GUI subsystem
        if: success()
        shell: pwsh
        run: .\installer\windows\test-windows-gui.ps1
      - name: Tauri NSIS bundle
        if: success()
        run: npm run tauri -- build
      - name: Exercise generated NSIS installer
        if: success()
        shell: pwsh
        run: .\installer\windows\test-nsis-installer.ps1
      - name: Package Chromium extension
        if: success()
        run: python scripts/build_extension_zip.py
      - name: Prepare release bundle and SHA-256 checksums
        if: success()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist/release" | Out-Null
          $installer = Get-ChildItem "target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "No se encontró el instalador NSIS generado." }
          $extension = Get-Item "dist/MilyVoiceTraductor-Chromium-Extension.zip"
          Copy-Item $installer.FullName "dist/release/$($installer.Name)"
          Copy-Item $extension.FullName "dist/release/$($extension.Name)"
          $lines = foreach ($file in Get-ChildItem "dist/release" -File) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($file.Name)"
          }
          $lines | Set-Content -Encoding ascii "dist/release/SHA256SUMS.txt"
      - name: Upload verified Windows installer and extension
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: MilyVoiceTraductor-Full-1.0.5-Windows-x64-${{ github.sha }}
          path: dist/release/*
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
