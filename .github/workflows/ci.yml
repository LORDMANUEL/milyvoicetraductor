name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-guards:
    name: Privacy and site guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Privacy scan
        run: python3 scripts/privacy_scan.py .
      - name: GitHub Pages smoke test
        run: python3 scripts/test_site.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Tests
        id: rust_tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee cargo-test.log
      - name: Annotate Rust diagnostics
        if: failure() && steps.rust_tests.outcome == 'failure'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          text = Path('cargo-test.log').read_text(encoding='utf-8', errors='replace')
          tail = '\n'.join(text.splitlines()[-80:])[-6000:]
          tail = re.sub(r'/home/runner/work/[^\s:]+', '<WORKSPACE>', tail)
          tail = re.sub(r'(?i)(token|password|secret|api[_-]?key)=\S+', r'\1=<REDACTED>', tail)
          escaped = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Rust test diagnostics::{escaped}')
          PY
      - name: Clippy
        if: success()
        run: cargo clippy --workspace --all-targets -- -D warnings
