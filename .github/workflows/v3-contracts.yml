name: V3 Contracts Kernel

on:
  pull_request:
    paths:
      - "contracts/**"
      - "scripts/test_v3_contracts.py"
      - ".github/workflows/v3-contracts.yml"
      - "docs/superpowers/specs/2026-08-23-milyvoice-3-contracts-kernel-design.md"
      - "docs/superpowers/plans/2026-08-23-milyvoice-3-contracts-kernel.md"
  push:
    branches:
      - "v3/**"
    paths:
      - "contracts/**"
      - "scripts/test_v3_contracts.py"
      - ".github/workflows/v3-contracts.yml"

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts compatibility gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compile validator
        run: python -m py_compile scripts/test_v3_contracts.py

      - name: Validate registry, compatibility and fixtures
        run: python scripts/test_v3_contracts.py
