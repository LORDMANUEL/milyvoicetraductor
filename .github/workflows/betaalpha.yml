name: BetaAlpha CPU Engine

on:
  push:
    branches: [betaalpha]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: betaalpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  betaalpha-windows:
    name: BetaAlpha Windows CPU certification
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Pin npm
        run: npm install --global npm@10.9.9
      - name: Install frontend dependencies
        run: npm install --prefix apps/desktop --workspaces=false --legacy-peer-deps --no-audit --no-fund
      - name: Frontend build
        run: npm run --prefix apps/desktop build
      - name: Install lightweight AI test dependencies
        run: python -m pip install --disable-pip-version-check "fastapi>=0.116,<1" "httpx>=0.28,<1" "numpy>=2.2,<3"
      - name: BetaAlpha unit and source verification
        env:
          PYTHONPATH: services/ai
        shell: pwsh
        run: |
          python scripts/run_ai_tests.py --timeout 120
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_source.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Offline bootstrap policy
        shell: pwsh
        run: .\installer\windows\test-bootstrap.ps1
      - name: Native Messaging bridge release build
        run: cargo build -p mily-bridge --release
      - name: Build private Python runtime
        shell: pwsh
        run: .\installer\windows\build-python-runtime.ps1
      - name: Validate private runtime
        shell: pwsh
        run: .\installer\windows\test-bootstrap.ps1 -RequireRuntime
      - name: Exercise installed flow
        shell: pwsh
        run: .\installer\windows\test-installed-flow.ps1
      - name: Target machine 2 GiB simulation
        shell: pwsh
        run: .\installer\windows\test-engine-hub-target-machine.ps1

      - name: Engine Hub baseline Moonshine benchmark
        shell: pwsh
        run: .\installer\windows\test-moonshine-lite.ps1
      - name: Engine Hub baseline Whisper Tiny benchmark
        shell: pwsh
        run: .\installer\windows\test-whisper-tiny-lite.ps1
      - name: Engine Hub baseline Mandarin benchmark
        shell: pwsh
        run: .\installer\windows\test-zh-es-lite.ps1
      - name: BetaAlpha real Zipformer and Paraformer CPU benchmark
        shell: pwsh
        run: .\installer\windows\test-betaalpha-sherpa-lite.ps1

      - name: Rust tests
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Windows desktop release build
        run: cargo build -p milyvoicetraductor-desktop --release
      - name: Verify Windows GUI subsystem
        shell: pwsh
        run: .\installer\windows\test-windows-gui.ps1
      - name: Tauri NSIS bundle
        run: npm run --prefix apps/desktop tauri -- build
      - name: Exercise generated NSIS installer
        shell: pwsh
        run: .\installer\windows\test-nsis-installer.ps1
      - name: Package Chromium extension
        run: python scripts/build_extension_zip.py

      - name: Prepare BetaAlpha release bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist/betaalpha" | Out-Null
          $installer = Get-ChildItem "target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "No se encontró el instalador NSIS BetaAlpha." }
          $extension = Get-Item "dist/MilyVoiceTraductor-Chromium-Extension.zip"
          $reports = @(
            "dist/performance/MilyVoiceTraductor-2.0.1-TargetMachineSimulation.json",
            "dist/performance/MilyVoiceTraductor-2.0.1-MoonshineLiteBench.json",
            "dist/performance/MilyVoiceTraductor-2.0.1-WhisperTinyLiteBench.json",
            "dist/performance/MilyVoiceTraductor-2.0.1-ZhEsLiteBench.json",
            "dist/performance/MilyVoiceTraductor-2.0.1-BetaAlphaSherpaBench.json"
          )
          Copy-Item $installer.FullName "dist/betaalpha/$($installer.Name)"
          Copy-Item $extension.FullName "dist/betaalpha/$($extension.Name)"
          foreach ($report in $reports) {
            if (-not (Test-Path $report -PathType Leaf)) { throw "Falta evidencia BetaAlpha: $report" }
            Copy-Item $report "dist/betaalpha/"
          }
          $lines = foreach ($file in Get-ChildItem "dist/betaalpha" -File) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($file.Name)"
          }
          $lines | Set-Content -Encoding ascii "dist/betaalpha/SHA256SUMS.txt"

      - name: Upload BetaAlpha Windows candidate
        uses: actions/upload-artifact@v6
        with:
          name: MilyVoiceTraductor-BetaAlpha-Windows-x64-${{ github.sha }}
          path: dist/betaalpha/*
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
