name: Runner probe

on:
  pull_request:
    branches: [runner-probe-20260819]

permissions:
  contents: read

jobs:
  probe:
    name: GitHub hosted runner probe
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Runner assigned
        run: |
          echo "RUNNER_PROBE_OK"
          uname -a
