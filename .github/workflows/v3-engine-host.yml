name: V3 Engine Host

on:
  pull_request:
    paths:
      - "services/engine_host/**"
      - "contracts/engine/**"
      - "contracts/index.json"
      - "manifests/milyvoice-3.components.json"
      - "scripts/test_v3_component_manifest.py"
      - ".github/workflows/v3-engine-host.yml"
      - "docs/superpowers/specs/2026-08-24-milyvoice-3-engine-host-1.0-design.md"
      - "docs/superpowers/plans/2026-08-24-milyvoice-3-engine-host-1.0.md"
  push:
    branches:
      - "v3/engine-host-*"
    paths:
      - "services/engine_host/**"
      - "contracts/engine/**"
      - "contracts/index.json"
      - "manifests/milyvoice-3.components.json"
      - "scripts/test_v3_component_manifest.py"
      - ".github/workflows/v3-engine-host.yml"

permissions:
  contents: read

jobs:
  linux:
    name: Engine Host Linux gate
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: services/engine_host:services/realtime
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compile Engine Host sources and tests
        run: python -m compileall -q services/engine_host
      - name: Engine Host tests
        run: python -m unittest discover -s services/engine_host/tests -p "test_*.py" -v

  windows:
    name: Engine Host Windows gate
    runs-on: windows-latest
    env:
      PYTHONPATH: "services/engine_host;services/realtime"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compile Engine Host sources and tests
        run: python -m compileall -q services/engine_host
      - name: Engine Host tests
        run: python -m unittest discover -s services/engine_host/tests -p "test_*.py" -v

  contracts:
    name: Engine Host contract/composition gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Contracts registry
        run: python scripts/test_v3_contracts.py
      - name: V3 composition
        run: python scripts/test_v3_component_manifest.py
