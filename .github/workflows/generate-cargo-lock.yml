name: Generate Cargo lock

on:
  push:
    branches:
      - hardening/complete-2.1-runtime-reproducibility

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: hardening/complete-2.1-runtime-reproducibility
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Regenerate Cargo.lock for current workspace
        run: cargo generate-lockfile
      - name: Validate current workspace with locked graph
        run: cargo test --locked --workspace --exclude milyvoicetraductor-desktop
      - name: Commit validated Cargo.lock to hardening branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock ya está actualizado"
          else
            git commit -m "chore(rust): lock workspace dependency graph"
            git push origin HEAD:hardening/complete-2.1-runtime-reproducibility
          fi
      - name: Upload generated Cargo.lock
        uses: actions/upload-artifact@v6
        with:
          name: MilyVoiceTraductor-Cargo-Lock-${{ github.sha }}
          path: Cargo.lock
          retention-days: 7
          if-no-files-found: error
