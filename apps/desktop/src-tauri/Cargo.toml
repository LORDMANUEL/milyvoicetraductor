[package]
name = "milyvoicetraductor-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "MilyVoiceTraductor"
path = "src/main.rs"

[lib]
name = "milyvoicetraductor_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
mily-core = { path = "../../../crates/mily-core" }
mily-config = { path = "../../../crates/mily-config" }
mily-database = { path = "../../../crates/mily-database" }
mily-logging = { path = "../../../crates/mily-logging" }
mily-cache = { path = "../../../crates/mily-cache" }
mily-system = { path = "../../../crates/mily-system" }
mily-engine = { path = "../../../crates/mily-engine" }
mily-models = { path = "../../../crates/mily-models" }
mily-sessions = { path = "../../../crates/mily-sessions" }

[dev-dependencies]
tempfile = "3"
