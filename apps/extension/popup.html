<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MilyVoiceTraductor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <img src="icons/icon48.png" alt="">
      <div><strong>MilyVoiceTraductor</strong><small>Traducción local · Tier 1 bidireccional</small></div>
    </header>

    <section class="connection-card" aria-label="Estado local">
      <div class="state-row"><span class="state-dot" id="appDot"></span><span>Aplicación</span><strong id="appState">Buscando…</strong></div>
      <div class="state-row"><span class="state-dot" id="engineDot"></span><span>Motor local</span><strong id="engineState">Buscando…</strong></div>
      <div class="state-row"><span class="state-dot" id="modelDot"></span><span>Modelo IA</span><strong id="modelState">Buscando…</strong></div>
    </section>

    <div class="row">
      <label>Origen<select id="source"><option value="auto">Automático</option><option value="en">Inglés</option><option value="es">Español</option><option value="zh">Chino</option></select></label>
      <label>Destino<select id="target"><option value="es">Español</option><option value="en">Inglés</option><option value="zh">Chino</option></select></label>
    </div>
    <div class="row">
      <label>Modo<select id="sessionMode"><option value="meeting">Reunión</option><option value="education">Educativo</option><option value="tutor">Tutor</option><option value="karaoke">Karaoke / canción</option><option value="compact">Compacto</option></select></label>
      <label>Tema<select id="subtitleTheme"><option value="auto">Automático</option><option value="mily">Mily azul</option><option value="cinema">Oscuro cine</option><option value="class">Clase clara</option><option value="contrast">Alto contraste</option><option value="neon">Karaoke neón</option></select></label>
    </div>
    <section id="tutorControls" class="tutor-card" hidden>
      <strong>Tutor</strong>
      <small>Subtítulo bilingüe + pronunciación de la frase original.</small>
      <label>Voz para repetir<select id="tutorVoice"><option value="">Voz automática</option></select></label>
    </section>
    <label class="check"><input id="persist" type="checkbox"><span>Guardar transcripción local</span></label>
    <label class="check"><input id="showOriginal" type="checkbox" checked><span>Mostrar texto original</span></label>
    <label class="check"><input id="speakerDetection" type="checkbox"><span>Identificar Hablante A/B/C</span></label>
    <div id="speakerControls" hidden>
      <label>Escuchar<select id="speakerFocus"><option value="all">Todos</option><option value="dominant">Voz dominante</option><option value="fixed">Fijar hablante</option></select></label>
      <label id="fixedSpeakerWrap" hidden>Hablante<select id="fixedSpeaker"><option value="">Seleccione…</option></select></label>
    </div>
    <label class="check"><input id="ttsEnabled" type="checkbox"><span>Voz traducida en tiempo real</span></label>
    <label id="ttsVoiceWrap" hidden>Voz predeterminada<select id="ttsVoice"><option value="">Voz del sistema</option></select></label>
    <section id="speakerVoiceList" class="speaker-voices" hidden aria-label="Voces por hablante"></section>
    <button id="toggle" class="primary" disabled>Preparando…</button>
    <p id="status" class="status" role="status">Detectando MilyVoiceTraductor…</p>
    <a id="downloadApp" class="download-link" href="https://github.com/LORDMANUEL/milyvoicetraductor/releases/latest" target="_blank" hidden>Descargar aplicación</a>
    <p class="privacy">Audio → solo <code>127.0.0.1</code>. Sin nube.</p>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
